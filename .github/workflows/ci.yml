# CI for the Cairn monorepo itself.
#
# Two jobs. `verify` keeps the workspace honest — @cairn/core, @cairn/cli,
# @cairn/mcp and cairn-desktop: build, typecheck, test. `cairn` is the ratchet
# — `cairn verify --all --proven-only` — running on the first dogfooded
# surface, apps/desktop, through the same reusable workflow that target
# projects copy from packages/cli/templates/ci/ (Phase 6: Cairn eats its own
# cooking). Keep it fast and boring.

name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
  pull_request:

# One run per ref. A new push supersedes the one still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` input on purpose: pnpm/action-setup reads the
      # `packageManager` field of the root package.json, so the pnpm used here
      # is exactly the one pinned in the repository.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # Must come after pnpm is on PATH: setup-node asks pnpm where its store
      # lives before caching it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # Typecheck runs after build: @cairn/cli resolves @cairn/core through its
      # published types (dist/index.d.ts), which only exist once core is built.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

  # The dogfooding ratchet: replay the proofs of every proven stone of the
  # desktop app. Same file target projects copy — cairn.yml IS the template.
  cairn:
    name: cairn ratchet (apps/desktop)
    uses: ./.github/workflows/cairn.yml
    with:
      working-directory: apps/desktop
      install-command: "corepack enable && pnpm install --frozen-lockfile && pnpm -r build"
      base-url: "http://127.0.0.1:5183"
