# CI for the Cairn monorepo itself.
#
# Two jobs. `verify` keeps the workspace honest — @cairn/core, @cairn/cli,
# @cairn/mcp and cairn-desktop: build, typecheck, test. `cairn` is the ratchet
# — `cairn verify --all --proven-only` — running on the first dogfooded
# surface, apps/desktop, through the same reusable workflow that target
# projects copy from packages/cli/templates/ci/ (Phase 6: Cairn eats its own
# cooking). Keep it fast and boring.

name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
  pull_request:

# One run per ref. A new push supersedes the one still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # No `version:` input on purpose: pnpm/action-setup reads the
      # `packageManager` field of the root package.json, so the pnpm used here
      # is exactly the one pinned in the repository.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Must come after pnpm is on PATH: setup-node asks pnpm where its store
      # lives before caching it.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # Typecheck runs after build: @cairn/cli resolves @cairn/core through its
      # published types (dist/index.d.ts), which only exist once core is built.
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

  # Supply-chain gate: no known-vulnerable production dependency ships.
  # Scoped to --prod and high severity so it blocks on what actually reaches
  # consumers, not on every advisory in devDependencies.
  audit:
    name: pnpm audit (prod, high)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # The dogfooding ratchet: replay the proofs of every proven stone of the
  # desktop app. Same file target projects copy — cairn.yml IS the template.
  cairn:
    name: cairn ratchet (apps/desktop)
    uses: ./.github/workflows/cairn.yml
    with:
      working-directory: apps/desktop
      # The trailing re-install is not a mistake: the first install runs before
      # @cairn/cli is built, so pnpm cannot create the `cairn` bin link
      # (dist/bin.js does not exist yet) and `npx cairn` would find nothing.
      # Re-running install after the build recreates the link in seconds.
      install-command: "corepack enable && pnpm install --frozen-lockfile && pnpm -r build && pnpm install --frozen-lockfile"
      base-url: "http://127.0.0.1:5183"
