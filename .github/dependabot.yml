# Dependabot: dependency and action updates, with a supply-chain cooldown.
#
# The 7-day cooldown mirrors `minimumReleaseAge` in pnpm-workspace.yaml: a
# freshly published version — the window in which worm-style npm compromises
# live before being unpublished — is never proposed. Grouping keeps the noise
# down to one PR per ecosystem per week.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
