[package]
name = "cairn-desktop"
version = "0.1.0"
description = "The Cairn review app"
authors = ["Cairn"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# The binary is a thin wrapper around the library so the same commands can be
# reused by tests and by other shells later.
[lib]
name = "cairn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

[features]
# Used by `tauri build --debug` and the CI dev profile.
custom-protocol = ["tauri/custom-protocol"]
